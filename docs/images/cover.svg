    <text x="76" y="276" font-size="88" font-weight="800" letter-spacing="-4">촬영의 맛을,</text>
    <text x="76" y="382" font-size="88" font-weight="800" letter-spacing="-4">30초에 담다.</text>
    <text x="80" y="454" font-size="27" font-weight="500">분석부터 자막 검수까지,</text>
    <text x="80" y="496" font-size="27" font-weight="500">편집기는 당신의 방식으로.</text>
