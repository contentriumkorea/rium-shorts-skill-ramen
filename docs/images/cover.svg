  <title id="title">Rium Shorts Skill - ramen</title>
  <desc id="desc">라면 그릇과 세로 영상 구도를 모티프로 한 스킬 커버. 촬영본 분석부터 자막 검수까지, 편집자가 선택한 도구로 작업하는 흐름을 소개한다.</desc>
