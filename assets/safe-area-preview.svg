  <g fill="#b44050" fill-opacity="0.35">
    <rect width="1080" height="288"/><rect y="1248" width="1080" height="672"/>
    <rect y="288" width="86" height="960"/><rect x="886" y="288" width="194" height="960"/>
  </g>
  <rect x="86" y="288" width="800" height="960" fill="none" stroke="#83dfbf" stroke-width="5" stroke-dasharray="16 12"/>
  <g font-family="Arial,sans-serif" fill="white" text-anchor="middle">
